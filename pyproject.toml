[tool.poetry]
name = "exact-kmeans"
version = "0.1.5"
description = "Computes an optimal k-means solution for small instances and small k."
authors = ["Melanie Schmidt <mschmidt@hhu.de>", "Daniel Schmidt <dschmidt@hhu.de>", "Giulia Baldini <giulia.baldini@hhu.de>", "Anna Arutyunova <anna.arutyunova@hhu.de>"]
readme = "README.md"
license = "LICENSE"
packages = [
    { include = "exact_kmeans" },
]
include = ["images"]

[tool.poetry.dependencies]
python = "^3.12"
gurobipy = "^13.0.3"
numpy = "^2.4.0"
scikit-learn = "^1.9.1"
pandas = "^3.1.0"

tqdm = "^4.70.1"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
pre-commit = "^4.7.0"
flake8 = "^7.5.0"
mypy = "^2.4.1"


[tool.poetry.group.viz.dependencies]
graphviz = "^0.21"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
create = true
in-project = true

[tool.isort]
profile = "black"
line_length = 88
